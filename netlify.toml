[build]
  publish = "."
  functions = "netlify/functions"

# Intake function is invoked at /.netlify/functions/intake by the site's forms.
# Required env var (set in the Netlify dashboard, never committed):
#   AIRTABLE_TOKEN — Airtable personal access token scoped to the Readable base.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Studio subdomain (Oct 9, 2026): studio.tabronmerryhill.com serves this same
# site. Its root should land on the V.I.S.I.O.N. Studio page, not the Readable
# homepage. Sub-paths (/studio/packages.html, /studio/portal/*) pass through.
[[redirects]]
  from = "https://studio.tabronmerryhill.com/"
  to = "/studio/"
  status = 302
  force = true

# DayMarket retirement (Oct 4, 2026): the old /daymarket/ path on this site now
# permanently redirects to the dedicated subdomain. force=true so it fires
# even though the static files still exist in the repo. (No effect on the
# daymarket-tm site, which serves those files at its own root.)
[[redirects]]
  from = "/daymarket/*"
  to = "https://daymarket.tabronmerryhill.com/:splat"
  status = 301
  force = true

# Agent gate (Oct 12, 2026): the Readable Station endpoint. Agents POST an
# assessment request to /api/agent/assessment-request; the 200 rewrite serves
# the agent-assessment Netlify function without exposing the functions path.
# Auth is x-agent-key, checked against the AGENT_API_KEY env var (dashboard).
[[redirects]]
  from = "/api/agent/assessment-request"
  to = "/.netlify/functions/agent-assessment"
  status = 200
