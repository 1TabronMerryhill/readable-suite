[build]
  publish = "."
  functions = "netlify/functions"

# Capture form posts to /.netlify/functions/daymarket -> Airtable List Subscribers.
# Required env var (set in the Netlify dashboard, never committed):
#   AIRTABLE_TOKEN — Airtable personal access token scoped to the SPIN base.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Readable Station prototype: agent gate. POST only (enforced in the function).
# Required env vars (set in the Netlify dashboard, never committed):
#   AGENT_API_KEY        — shared secret checked against the x-agent-key header
#   SUPABASE_SERVICE_KEY — service-role key for Supabase REST writes
[[redirects]]
  from = "/api/agent/order"
  to = "/.netlify/functions/agent-order"
  status = 200

# Readable Station Gate 2 (Phone Gate).
[[redirects]]
  from = "/api/station/sms"
  to = "/.netlify/functions/sms-inbound"
  status = 200

[[redirects]]
  from = "/api/station/voice"
  to = "/.netlify/functions/voice-webhook"
  status = 200

# Readable Station Gate 2 — Retell custom function (Phase 3 voice).
[[redirects]]
  from = "/api/station/retell"
  to = "/.netlify/functions/retell-function"
  status = 200

# Readable Station — data tools for voice agents (menu, packages, hours, orders).
[[redirects]]
  from = "/api/station/tools"
  to = "/.netlify/functions/station-tools"
  status = 200

# DayMarket AI sells agent — holiday proposals (manager input + business data).
# Required env vars (set in the Netlify dashboard, never committed):
#   GROQ_API_KEY         — shared with the station functions
#   SUPABASE_SERVICE_KEY — already required by the station functions
[[redirects]]
  from = "/api/daymarket/ai-holiday"
  to = "/.netlify/functions/ai-holiday"
  status = 200
